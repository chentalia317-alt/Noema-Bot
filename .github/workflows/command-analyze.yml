name: "Command: /analyze"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      file:
        description: "Optional data file under data/ (e.g., baseline_cleaned_v7.csv)"
        required: false
        default: ""
      n:
        description: "Max numeric columns to plot (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  run:
    # 触发条件
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' &&
         !github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/analyze'))
      }}
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须为0，才可 git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Resolve args (FILE & N)
        id: args
        shell: bash
        run: |
          set -euo pipefail
          FILE_INPUT=""
          N_INPUT="0"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE_INPUT="${{ inputs.file }}"
            N_INPUT="${{ inputs.n }}"
          else
            RAW="${{ github.event.comment.body }}"
            FILE_INPUT=$(echo "$RAW" | grep -oP 'file=\K[\w\.\-\/]+' || echo "")
            N_INPUT=$(echo "$RAW" | grep -oP 'n=\K\d+' || echo "0")
          fi

          echo "file=$FILE_INPUT"     >> "$GITHUB_OUTPUT"
          echo "n=$N_INPUT"           >> "$GITHUB_OUTPUT"
          echo "✅ Resolved: FILE='${FILE_INPUT:-<ALL>}'  N='${N_INPUT}'"

      - name: Run analysis
        run: |
          mkdir -p reports 
          echo "🚀 Running analysis script..."
          python scripts/analyze.py --file "${{ steps.args.outputs.file }}" --n "${{ steps.args.outputs.n }}"


      - name: Read summary
        id: summary
        shell: bash
        run: |
          set -e
          if [ ! -f report_summary.json ]; then
            echo "::warning::report_summary.json not found. Analysis might have failed."
            echo "md=Analysis failed or produced no output." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sudo apt-get update -y > /dev/null
          sudo apt-get install -y jq > /dev/null
          
          MD="$(jq -r '.markdown' report_summary.json)"
          
          {
            echo 'md<<EOF'
            echo "$MD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Quarkdown 渲染
      # ------------------------------------------------------------------
      - name: Set up Java 17 (Required for Quarkdown)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Quarkdown CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/quarkdown-labs/get-quarkdown/refs/heads/main/install.sh | sudo env "PATH=$PATH" bash
          quarkdown --version || echo "Quarkdown version check failed but continuing..."

      - name: Compile .qd to HTML
        run: |
          set -e
          mkdir -p reports

          # 1. 编译主报告
          if [ -f ./reports/noema-report.qd ]; then
            echo "📄 Compiling Report..."
            quarkdown c ./reports/noema-report.qd -o ./reports
            
            # 整理文件
            # 如果生成了reports/noema-report/index.html，移动为 reports/report.html
            if [ -d "./reports/noema-report" ]; then
                mv ./reports/noema-report/index.html ./reports/report.html
                cp -r ./reports/noema-report/* ./reports/ 2>/dev/null || true
                rm -rf ./reports/noema-report
            elif [ -f "./reports/index.html" ]; then
                mv ./reports/index.html ./reports/report.html
            fi
          fi

          # 2. 编译 Dashboard
          if [ -f ./reports/dashboard.qd ]; then
            echo "📊 Compiling Dashboard..."
            quarkdown c ./reports/dashboard.qd -o ./reports
            
            # 如果有reports/dashboard/index.html，移动为 reports/index.html
            if [ -d "./reports/dashboard" ]; then
                mv ./reports/dashboard/index.html ./reports/index.html
                cp -r ./reports/dashboard/* ./reports/ 2>/dev/null || true
                rm -rf ./reports/dashboard
            fi
          fi

          # 兜底
          if [ ! -f ./reports/index.html ] && [ -f ./reports/report.html ]; then
            cp ./reports/report.html ./reports/index.html
          fi

          touch ./reports/.nojekyll

      - name: Commit reports back
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ report_summary.json
          git commit -m "chore: update analysis artifacts [skip ci]" || echo "⚠️ No changes to commit"
          git pull --rebase origin main
          git push origin main

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # ------------------------------------------------------------------
      # reply comments
      # ------------------------------------------------------------------
      - name: Comment back as Noema-Bot
        if: ${{ github.event_name == 'issue_comment' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            🤖 **Noema-Bot Analysis Completed**

            **📊 Dashboard:**
            ${{ steps.deploy.outputs.page_url }}

            **📄 Full Report:**
            ${{ steps.deploy.outputs.page_url }}report.html

            <details>
            <summary>📝 Analysis Summary</summary>

            ${{ steps.summary.outputs.md }}
            </details>
